<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Calculadora de Comisiones</title>

    <link rel="stylesheet" href="ventas.css">

    <script src="utilitario.js" defer></script>
    <script src="ventas.js" defer></script>

</head>

<body>

    <div class="contenedor">

        <h1>Calculadora de Comisiones</h1>


        <!-- SALARIO BASE -->

        <label for="txtSueldoBase">
            Salario Base ($):
        </label>

        <input
            type="text"
            id="txtSueldoBase"
            placeholder="Ej: 500.00"
        >

        <span
            id="errorSueldoBase"
            class="mensaje-error"
        ></span>


        <!-- NÚMERO DE VENTAS -->

        <label for="txtVentas">
            Número de ventas:
        </label>

        <input
            type="text"
            id="txtVentas"
            placeholder="Ej: 10"
        >

        <span
            id="errorVentas"
            class="mensaje-error"
        ></span>


        <!-- PRECIO DEL PRODUCTO -->

        <label for="txtPrecio">
            Precio del producto ($):
        </label>

        <input
            type="text"
            id="txtPrecio"
            placeholder="Ej: 25.50"
        >

        <span
            id="errorPrecio"
            class="mensaje-error"
        ></span>


        <!-- BOTÓN CALCULAR -->

        <button
            type="button"
            onclick="calcular()"
        >
            Calcular Simulador
        </button>


        <!-- BOTÓN LIMPIAR -->

        <button
            type="button"
            onclick="limpiar()"
        >
            Limpiar datos
        </button>


        <!-- RESULTADOS -->

        <h2>Resultados</h2>

        <p>
            Salario Base:
            $<span id="spSueldoBase"></span>
        </p>

        <p>
            Comisión:
            $<span id="spComision"></span>
        </p>

        <p>
            Total:
            $<span id="spTotal"></span>
        </p>

    </div>

</body>

</html>
